name: Continuous Integration

# Tell GitHub WHEN to run this script (every time code is pushed to main)
on:
  push:
    branches: [ "main" ]

# Tell GitHub WHAT to do
jobs:
  test-my-code:
    runs-on: ubuntu-latest # This spins up a temporary Linux server

    steps:
    # Step 1: Download your repository code onto the server
    - name: Check out repository
      uses: actions/checkout@v4

    # Step 2: Install Python on the server
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Step 3: Install pytest
    - name: Install dependencies
      run: pip install pytest

    # Step 4: Run the exact test command we used locally
    - name: Run tests
      run: python -m pytest